id: H4
title: Medieval Latin scribal abbreviation
family: substitution
description: >
  The plaintext is Latin written with the standard medieval suspension and
  contraction system (dropped final -us/-um/-is, nasal contraction, -que as a
  single sign), then substituted glyph for glyph.
prior: medium-high
prior_rationale: >
  The herbal register and the fifteenth-century date make abbreviated Latin the
  most plausible single plaintext; abbreviation also lowers entropy and word
  length in the observed direction.
phase1_evidence:
  for:
    - Suffix inventory (ody, s, o) behaves like a small closed ending set
    - Herbal Latin (Clusius) is the closest register available
  against:
    - Abbreviation is irregular in real manuscripts; the deterministic transform used here is a crude proxy
prediction: >
  Decoding against an abbreviation-transformed Latin model beats decoding
  against plain Latin, and beats the baseline.
falsifier: >
  The abbreviated-Latin model does no better than plain Latin, or loses to the baseline.
funded: true
budget_share: 0.06
search:
  kind: substitution
  languages: [vulgate_clementine, clusius_rariorum]
  lm_order: 3
  abbreviate: true
  iterations: 120000
  restarts: 8
nulls: [grille, selfcite, shuffle_chars, markov_chars]
